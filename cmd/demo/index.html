<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lucky Star Notify (Go) — 推播 Demo</title>

<!--
  用 CDN 上的 @stomp/stompjs，而不是自己手寫一個 STOMP client。

  這是刻意的：本專案的賣點是「伺服器端的 STOMP 1.2 是自己實作的」。
  如果連 client 也自己寫，那證明的只是「我的兩份實作互相相容」——
  意義接近於零。用業界標準 client 連得上，證明的才是**與規格相容**。

  代價：這一頁需要連得到網路。離線環境下 stompjs 載入失敗，
  頁面會顯示提示而不是一片空白（見 initError）。
-->
<script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.1.1/bundles/stomp.umd.min.js"></script>

<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --panel: #f6f7f9;
    --border: #dfe3e8;
    --fg: #1a1d21;
    --muted: #6b7280;
    --accent: #2563eb;
    --ok: #15803d;
    --warn: #b45309;
    --err: #b91c1c;
    --mono: ui-monospace, SFMono-Regular, "Cascadia Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115;
      --panel: #171a20;
      --border: #2a2f39;
      --fg: #e6e8eb;
      --muted: #9aa3af;
      --accent: #60a5fa;
      --ok: #4ade80;
      --warn: #fbbf24;
      --err: #f87171;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 1.5rem;
    background: var(--bg);
    color: var(--fg);
    font: 15px/1.6 system-ui, -apple-system, "Noto Sans TC", sans-serif;
  }
  h1 { font-size: 1.25rem; margin: 0 0 .25rem; }
  .sub { color: var(--muted); font-size: .875rem; margin: 0 0 1.25rem; }

  .bar {
    display: flex; flex-wrap: wrap; gap: .75rem; align-items: center;
    padding: .875rem 1rem; margin-bottom: 1.25rem;
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
  }
  label { font-size: .875rem; color: var(--muted); }
  select, button {
    font: inherit; padding: .4rem .75rem; border-radius: 7px;
    border: 1px solid var(--border); background: var(--bg); color: var(--fg);
  }
  button { cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .45; cursor: not-allowed; }

  .status { display: inline-flex; align-items: center; gap: .45rem; font-size: .875rem; margin-left: auto; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
  .dot.on { background: var(--ok); }
  .dot.err { background: var(--err); }

  .cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: 1.25rem; }
  @media (max-width: 820px) { .cols { grid-template-columns: minmax(0, 1fr); } }

  section { min-width: 0; }
  h2 { font-size: .8125rem; text-transform: uppercase; letter-spacing: .06em;
       color: var(--muted); margin: 0 0 .625rem; }

  table { width: 100%; border-collapse: collapse; font-size: .9375rem; }
  th, td { text-align: left; padding: .4rem .5rem; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; font-size: .8125rem; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; font-family: var(--mono); }

  #log { display: flex; flex-direction: column; gap: .5rem; max-height: 65vh; overflow-y: auto; }
  .msg { border: 1px solid var(--border); border-radius: 8px; background: var(--panel); padding: .625rem .75rem; }
  .msg header { display: flex; gap: .5rem; align-items: baseline; margin-bottom: .375rem; }
  .badge { font-size: .6875rem; font-weight: 600; padding: .1rem .45rem; border-radius: 4px;
           border: 1px solid currentColor; }
  .badge.private { color: var(--accent); }
  .badge.broadcast { color: var(--warn); }
  .badge.rank { color: var(--ok); }
  .dest { font-family: var(--mono); font-size: .75rem; color: var(--muted); }
  .time { margin-left: auto; font-size: .75rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  pre { margin: 0; font-family: var(--mono); font-size: .8125rem; white-space: pre-wrap;
        word-break: break-word; overflow-x: auto; }
  .empty { color: var(--muted); font-size: .875rem; }
  .banner { padding: .75rem 1rem; border-radius: 8px; margin-bottom: 1rem;
            border: 1px solid var(--err); color: var(--err); font-size: .875rem; }
</style>
</head>
<body>

<h1>Lucky Star Notify <span style="color:var(--muted);font-weight:400">/ Go</span></h1>
<p class="sub">
  自行實作的 STOMP 1.2 伺服器，用標準的 <code>@stomp/stompjs</code> client 連線。
  事件由 <code>demo</code> 容器灌進 Kafka，經推播服務送到這裡。
</p>

<div id="banner" class="banner" hidden></div>

<div class="bar">
  <label for="player">登入身分</label>
  <select id="player"></select>
  <button id="connect" class="primary">連線</button>
  <button id="disconnect" disabled>中斷</button>
  <button id="clear">清空</button>
  <span class="status"><span id="dot" class="dot"></span><span id="statusText">未連線</span></span>
</div>

<div class="cols">
  <section>
    <h2>排行榜 <span style="text-transform:none;letter-spacing:0">/topic/rank</span></h2>
    <table>
      <thead><tr><th>#</th><th>玩家</th><th style="text-align:right">分數</th></tr></thead>
      <tbody id="rank"><tr><td colspan="3" class="empty">等待 rank.update…</td></tr></tbody>
    </table>
  </section>

  <section>
    <h2>收到的訊息</h2>
    <div id="log"><p class="empty">連線後，這裡會即時顯示收到的 STOMP MESSAGE 帧。</p></div>
  </section>
</div>

<script>
(function () {
  'use strict';

  const $ = (id) => document.getElementById(id);
  const els = {
    banner: $('banner'), player: $('player'), connect: $('connect'),
    disconnect: $('disconnect'), clear: $('clear'),
    dot: $('dot'), statusText: $('statusText'), rank: $('rank'), log: $('log'),
  };

  // 三個訂閱對應服務的三條推播路徑。
  //
  // ⚠️ /user/queue/notifications 一定要**明確訂閱**。
  // 伺服器的 PushToPlayer 只送給「該玩家且訂了這個 destination」的連線，
  // 漏訂的話私人訊息會安靜地不見——沒有錯誤，只有「怎麼沒反應」。
  const SUBSCRIPTIONS = [
    { destination: '/user/queue/notifications', kind: 'private',   label: '私人' },
    { destination: '/topic/notifications',      kind: 'broadcast', label: '公告' },
    { destination: '/topic/rank',               kind: 'rank',      label: '排行' },
  ];

  const MAX_LOG = 50;
  let client = null;
  let config = null;

  function banner(text) {
    els.banner.textContent = text;
    els.banner.hidden = false;
  }

  function setStatus(text, state) {
    els.statusText.textContent = text;
    els.dot.className = 'dot' + (state ? ' ' + state : '');
  }

  function setConnected(connected) {
    els.connect.disabled = connected;
    els.disconnect.disabled = !connected;
    els.player.disabled = connected;
  }

  // 一律用 textContent 塞內容，不用 innerHTML。
  // 訊息內容來自 Kafka，是外部輸入——即使這只是 demo，也不該示範一個
  // 把外部字串當 HTML 執行的寫法。
  function addMessage(sub, body) {
    if (els.log.firstElementChild && els.log.firstElementChild.className === 'empty') {
      els.log.textContent = '';
    }

    const card = document.createElement('div');
    card.className = 'msg';

    const head = document.createElement('header');
    const badge = document.createElement('span');
    badge.className = 'badge ' + sub.kind;
    badge.textContent = sub.label;
    const dest = document.createElement('span');
    dest.className = 'dest';
    dest.textContent = sub.destination;
    const time = document.createElement('span');
    time.className = 'time';
    time.textContent = new Date().toLocaleTimeString('zh-TW', { hour12: false });
    head.append(badge, dest, time);

    const pre = document.createElement('pre');
    pre.textContent = pretty(body);

    card.append(head, pre);
    els.log.prepend(card);

    while (els.log.children.length > MAX_LOG) {
      els.log.lastElementChild.remove();
    }
  }

  function pretty(body) {
    try {
      return JSON.stringify(JSON.parse(body), null, 2);
    } catch (e) {
      // 解析不出來就原樣顯示——那本身就是值得看到的資訊。
      return body;
    }
  }

  function renderRank(body) {
    let entries;
    try {
      entries = JSON.parse(body).entries;
    } catch (e) {
      return;
    }
    if (!Array.isArray(entries) || entries.length === 0) { return; }

    els.rank.textContent = '';
    for (const entry of entries) {
      const tr = document.createElement('tr');
      const rank = document.createElement('td');
      rank.textContent = entry.rank;
      const name = document.createElement('td');
      name.textContent = entry.nickname;
      const score = document.createElement('td');
      score.className = 'num';
      score.textContent = Number(entry.score).toLocaleString('zh-TW');
      tr.append(rank, name, score);
      els.rank.append(tr);
    }
  }

  async function connect() {
    const playerId = els.player.value;
    setStatus('取得 token…');

    let token;
    try {
      const res = await fetch('/api/token?playerId=' + encodeURIComponent(playerId));
      if (!res.ok) { throw new Error(await res.text()); }
      token = (await res.json()).token;
    } catch (err) {
      setStatus('取得 token 失敗', 'err');
      banner('取得 token 失敗：' + err.message);
      return;
    }

    setStatus('連線中…');
    client = new StompJs.Client({
      brokerURL: config.wsUrl,
      // token 走 CONNECT 帧的 Authorization header，與 Java 版一致。
      // 不放在 URL query 是因為網址會進瀏覽器紀錄與伺服器 access log，
      // 而 token 是憑證。
      connectHeaders: { Authorization: 'Bearer ' + token },
      // 與伺服器宣告的 10 秒對齊。協商規則是取 max，所以要求更快也沒用。
      heartbeatIncoming: 10000,
      heartbeatOutgoing: 10000,
      reconnectDelay: 3000,

      onConnect: function () {
        setStatus('已連線（玩家 ' + playerId + '）', 'on');
        setConnected(true);
        for (const sub of SUBSCRIPTIONS) {
          client.subscribe(sub.destination, function (message) {
            addMessage(sub, message.body);
            if (sub.kind === 'rank') { renderRank(message.body); }
          });
        }
      },

      // 伺服器主動送 ERROR 帧（驗章失敗、或關機通知）時走這裡。
      onStompError: function (frame) {
        setStatus('伺服器回報錯誤', 'err');
        banner('STOMP ERROR：' + (frame.headers.message || '') + ' ' + (frame.body || ''));
      },

      onWebSocketClose: function () {
        setStatus('連線中斷，重連中…', 'err');
        setConnected(false);
      },
    });

    client.activate();
  }

  function disconnect() {
    if (!client) { return; }
    // deactivate() 會送 DISCONNECT 帧並停掉自動重連；
    // 直接關 socket 的話 client 會判定成斷線而不停重試。
    client.deactivate();
    client = null;
    setStatus('未連線');
    setConnected(false);
  }

  async function init() {
    if (typeof StompJs === 'undefined') {
      banner('載入 @stomp/stompjs 失敗（CDN 連不到？）。這一頁需要網路連線。');
      els.connect.disabled = true;
      return;
    }

    try {
      config = await (await fetch('/api/config')).json();
    } catch (err) {
      banner('讀取 /api/config 失敗：' + err.message);
      els.connect.disabled = true;
      return;
    }

    for (const p of config.players) {
      const option = document.createElement('option');
      option.value = p.id;
      option.textContent = p.nickname + '（' + p.id + '）';
      els.player.append(option);
    }

    els.connect.addEventListener('click', connect);
    els.disconnect.addEventListener('click', disconnect);
    els.clear.addEventListener('click', function () {
      els.log.textContent = '';
    });
  }

  init();
})();
</script>
</body>
</html>
